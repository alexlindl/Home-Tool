name: "Household Management"
description: "Manage household tasks and shopping lists directly from Home Assistant"
version: "1.2.1"
slug: "household-management"
url: "https://github.com/alexlindl/Home-Tool"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
ingress: true
ingress_port: 8023
ingress_entry: "/"
hassio_api: true
homeassistant_api: true
panel_icon: "mdi:clipboard-check-outline"
panel_title: "Household"
ports:
  8023/tcp: 8023
ports_description:
  8023/tcp: "Web interface (direct access)"
map:
  - addon_config:rw
options:
  db_password: "household123"
  db_name: "household_app"
  db_user: "household"
  log_level: "info"
schema:
  db_password: str
  db_name: str
  db_user: str
  log_level: list(error|warn|info|debug)
